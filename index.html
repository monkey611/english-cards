<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🌈 幼儿趣味英语启蒙 · 开心学英语</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/catalog.css">
<link rel="stylesheet" href="css/reader.css">
<link rel="stylesheet" href="css/tabs.css">
<link rel="stylesheet" href="css/challenge.css">
<link rel="stylesheet" href="css/profile.css">
<link rel="stylesheet" href="css/effects.css">
<link rel="stylesheet" href="css/speaking.css">
</head>
<body>

<div class="splash" id="splash">
  <div class="splash-logo">🌈</div>
  <div class="splash-title">开心学英语</div>
  <div class="splash-sub">宝贝准备好了吗？</div>
  <div class="splash-loading"><div class="splash-loading-bar" id="loadingBar"></div></div>
</div>

<div class="catalog" id="catalog">
  <div class="catalog-header">
    <div class="catalog-title">
      <span>🌈</span><span>开</span><span>心</span><span>学</span><span>英</span><span>语</span>
    </div>
    <div class="catalog-sub">点一点，学一学，每天进步一点点 ✨</div>
    <div class="catalog-stats">
      <span id="totalWords">0 个词汇</span>
      <span id="totalPhrases">0 个短句</span>
      <span id="totalDialogues">0 组对话</span>
    </div>
  </div>
  <div class="catalog-nav" id="catalogNav">
    <button class="catalog-nav-toggle" id="navToggle">◀</button>
    <div class="catalog-nav-inner" id="catalogNavInner"></div>
  </div>
  <div id="catalogContent"></div>
</div>

<div class="reader" id="reader">
  <div class="reader-top">
    <div class="reader-title" id="readerTitle">动物</div>
    <div class="page-indicator" id="pageIndicator">1/10</div>
  </div>

  <div class="card-container" id="cardContainer">
    <div class="card-header-btns">
      <button class="btn-back" id="btnBack">← 返回</button>
      <button class="btn-auto" id="btnAuto">▶ 自动</button>
    </div>
    <div class="card-wrapper" id="cardWrapper">
      <div class="card" id="card">
        <div class="particles" id="particles"></div>
        <div class="card-image" id="cardImage">🐶</div>
        <div id="cardContent">
          <div class="card-english" id="cardEnglish">Dog</div>
          <div class="card-chinese" id="cardChinese">狗</div>
        </div>
        <div id="dialogueArea" class="dialogue-area" style="display:none"></div>
        <button class="btn-speak" id="btnSpeak">
          <span class="icon">🔊</span> 听一听
        </button>
      </div>
    </div>
  </div>

  <div class="reader-bottom">
    <button class="btn-nav" id="btnPrev"><span class="arrow">◀</span> 上一个</button>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <button class="btn-nav" id="btnNext">下一个 <span class="arrow">▶</span></button>
  </div>
</div>

<div class="confetti-container" id="confettiContainer"></div>

<!-- ========== 底部Tab栏 ========== -->
<div class="tab-bar" id="tabBar">
  <button class="tab-item active" data-tab="home">
    <span class="tab-icon">🏠</span>
    <span>主页</span>
  </button>
  <button class="tab-item" data-tab="challenge">
    <span class="tab-icon">🎮</span>
    <span>闯关</span>
  </button>
  <button class="tab-item" data-tab="speaking">
    <span class="tab-icon">🎤</span>
    <span>口语</span>
  </button>
  <button class="tab-item" data-tab="profile">
    <span class="tab-icon">👤</span>
    <span>我的</span>
  </button>
</div>

<!-- ========== 闯关页 ========== -->
<div class="page-challenge" id="pageChallenge">
  <div id="challengeContent"></div>
</div>

<!-- ========== 口语练习页 ========== -->
<div class="page-speaking" id="pageSpeaking">
  <div id="speakingContent"></div>
</div>

<!-- ========== 我的页 ========== -->
<div class="page-profile" id="pageProfile">
  <div id="profileContent"></div>
</div>


<script src="js/data.js"></script>
<script src="js/data2.js"></script>
<script src="js/data3.js"></script>
<script src="js/util.js"></script>
<script src="js/effects.js"></script>
<script src="audio/audio-manifest.js"></script>
<script src="js/audio-player.js"></script>
<script src="js/speech.js"></script>
<script src="js/storage.js"></script>
<script src="js/questions.js"></script>
<script src="js/reader.js"></script>
<script src="js/challenge.js"></script>
<script src="js/speaking.js"></script>
<script src="js/profile.js"></script>
<script src="js/tests.js"></script>
<script src="js/app.js"></script>
</body>
</html>
