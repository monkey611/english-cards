<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🌈 幼儿趣味英语启蒙 · 开心学英语</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* ========== 全局重置 ========== */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #F5F0EB;
    --card-bg: #FFFBF7;
    --primary: #C4A882;
    --primary-light: #E8DDD0;
    --secondary: #A8C5C0;
    --accent: #E8B4B8;
    --accent2: #C4A8D9;
    --text: #5C4E3D;
    --text-light: #9A8B7A;
    --shadow: rgba(156, 134, 112, 0.15);
    --shadow-strong: rgba(156, 134, 112, 0.25);
    --green: #B5C9B0;
    --yellow: #E4D5B0;
    --orange: #E8C9A0;
    --blue: #B0C4D9;
    --pink: #E8B4B8;
    --purple: #C4A8D9;
  }

  body {
    font-family: 'Nunito', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    height: 100vh;
    height: 100dvh;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ========== 启动页 ========== */
  .splash {
    position: fixed; inset: 0; z-index: 999;
    background: linear-gradient(160deg, #E8DDD0 0%, #D4C5B5 50%, #C4A882 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  .splash.hide { opacity: 0; transform: scale(1.1); pointer-events: none; }
  .splash-logo { font-size: 80px; animation: splashBounce 1.2s ease infinite; }
  .splash-title { font-size: 32px; font-weight: 900; color: #fff; margin-top: 12px; text-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  .splash-sub { font-size: 16px; color: rgba(255,255,255,0.8); margin-top: 6px; }
  .splash-loading { margin-top: 30px; width: 200px; height: 4px; background: rgba(255,255,255,0.3); border-radius: 4px; overflow: hidden; }
  .splash-loading-bar { height: 100%; width: 0%; background: #fff; border-radius: 4px; transition: width 0.3s; }
  @keyframes splashBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }

  /* ========== 目录页 ========== */
  .catalog {
    position: fixed; inset: 0;
    background: var(--bg);
    overflow-y: auto;
    z-index: 100;
    padding: 10px 12px 80px;
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .catalog.hidden { transform: translateX(-110%); }

  .catalog-header {
    text-align: center;
    padding: 20px 0 16px;
    background: var(--bg);
  }
  .catalog-title {
    font-size: 28px; font-weight: 900;
    color: var(--text); letter-spacing: 1px;
  }
  .catalog-title span { display: inline-block; animation: titleWave 2s ease infinite; }
  .catalog-title span:nth-child(2) { animation-delay: 0.1s; }
  .catalog-title span:nth-child(3) { animation-delay: 0.2s; }
  .catalog-title span:nth-child(4) { animation-delay: 0.3s; }
  .catalog-title span:nth-child(5) { animation-delay: 0.4s; }
  .catalog-title span:nth-child(6) { animation-delay: 0.5s; }
  .catalog-title span:nth-child(7) { animation-delay: 0.6s; }
  @keyframes titleWave {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .catalog-sub { font-size: 13px; color: var(--text-light); margin-top: 4px; }
  .catalog-stats {
    display: flex; justify-content: center; gap: 12px;
    margin-top: 10px; font-size: 12px; color: var(--text-light);
  }
  .catalog-stats span {
    background: var(--primary-light); padding: 3px 14px; border-radius: 20px;
    color: var(--text);
  }

  /* ========== 分类导航 ========== */
  .catalog-nav {
    position: sticky; top: 0; z-index: 20;
    display: flex;
    align-items: flex-start;
    padding: 0;
    transition: transform 0.3s ease;
    margin-bottom: 0;
    min-height: 42px;
  }
  .catalog-nav.hide-nav {
    transform: translateX(-100%);
  }
  .catalog-nav-bar {
    display: flex;
    align-items: center;
    flex: 1;
    overflow: hidden;
    background: var(--bg);
    padding: 6px 0 8px 0;
    transition: flex 0.3s ease, padding 0.3s ease, max-width 0.3s ease;
    max-width: 1000px;
  }
  .catalog-nav.collapsed .catalog-nav-bar {
    flex: 0 0 0;
    padding: 0;
    overflow: hidden;
    max-width: 0;
  }
  .catalog-nav-toggle-wrap {
    position: sticky;
    left: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }
  .catalog-nav-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    min-width: 28px;
    height: 36px;
    border: none;
    background: var(--primary-light);
    color: var(--text);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    border-radius: 0 14px 14px 0;
    flex-shrink: 0;
    z-index: 2;
    transition: all 0.3s;
    box-shadow: 2px 0 6px var(--shadow);
    margin-top: 6px;
    position: relative;
  }
  .catalog-nav-toggle:active { transform: scale(0.9); }
  .catalog-nav-toggle.collapsed {
    border-radius: 14px;
    box-shadow: 0 2px 8px var(--shadow-strong);
  }
  .catalog-nav-toggle.pinned {
    background: var(--primary-light);
    color: var(--text);
  }
  .catalog-nav-item {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-light);
    background: var(--card-bg);
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 2px 6px var(--shadow);
    border: 2px solid transparent;
    flex-shrink: 0;
  }
  .catalog-nav-item:active { transform: scale(0.93); }
  .catalog-nav-item.active {
    background: var(--primary-light);
    color: var(--text);
    border-color: var(--primary);
  }

  .catalog-nav-item .nav-icon { font-size: 16px; }

  .catalog-group { margin-bottom: 14px; }
  .catalog-group-title {
    font-size: 15px; font-weight: 800;
    padding: 6px 16px; margin: 0 8px 8px;
    color: var(--text);
    background: var(--primary-light);
    border-radius: 20px;
    display: inline-block;
    position: sticky; top: 90px; z-index: 5;
  }

  .catalog-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    max-width: 500px;
    margin: 0 auto;
    padding: 0 6px;
  }

  .catalog-item {
    background: var(--card-bg);
    border-radius: 18px;
    padding: 14px 6px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 3px 12px var(--shadow);
    border: 2px solid transparent;
    animation: catalogItemIn 0.4s ease backwards;
  }
  @keyframes catalogItemIn {
    from { opacity: 0; transform: translateY(20px) scale(0.9); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .catalog-item:active { transform: scale(0.93); }
  .catalog-item .icon { font-size: 36px; display: block; margin-bottom: 4px; }
  .catalog-item .name { font-size: 13px; font-weight: 800; color: var(--text); }
  .catalog-item .count { font-size: 10px; color: var(--text-light); }

  /* ========== 阅读器 ========== */
  .reader {
    position: fixed; inset: 0;
    display: flex;
    flex-direction: column;
    transform: translateX(110%);
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 200;
  }
  .reader.active { transform: translateX(0); }

  .reader-top {
    display: flex;
    align-items: center;
    padding: 12px 14px;
    flex-shrink: 0;
    z-index: 10;
    gap: 10px;
  }
  .btn-back {
    background: var(--card-bg);
    border: none; color: var(--text);
    font-size: 13px; font-weight: 700;
    padding: 8px 16px;
    border-radius: 22px;
    cursor: pointer;
    box-shadow: 0 2px 8px var(--shadow);
    transition: transform 0.15s;
  }
  .btn-back:active { transform: scale(0.93); }
  .reader-title { flex: 1; font-size: 16px; font-weight: 800; color: var(--text); }
  .page-indicator {
    font-size: 13px; font-weight: 700;
    color: var(--text-light);
    background: var(--primary-light);
    padding: 4px 14px; border-radius: 20px;
  }

  /* ========== 卡片容器 ========== */
  .card-container {
    flex: 1;
    position: relative;
    overflow: hidden;
    padding: 10px 16px 16px;
  }
  .card-container::before {
    content: '';
    position: absolute; inset: 0;
    background: rgba(92, 78, 61, 0.5);
    opacity: 0;
    transition: opacity 0.5s ease;
    z-index: 0;
    pointer-events: none;
  }
  .card-container.overlay::before {
    opacity: 1;
  }
  .card-header-btns {
    position: absolute;
    top: 8px; left: 12px; right: 12px;
    display: flex;
    justify-content: space-between;
    z-index: 5;
    pointer-events: none;
  }
  .card-header-btns .btn-back,
  .card-header-btns .btn-auto {
    pointer-events: auto;
  }
  .card-header-btns .btn-back {
    background: var(--card-bg);
    border: none; color: var(--text);
    font-size: 12px; font-weight: 700;
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
    box-shadow: 0 2px 8px var(--shadow-strong);
    transition: transform 0.15s;
  }
  .card-header-btns .btn-back:active { transform: scale(0.93); }
  .card-header-btns .btn-auto {
    background: var(--card-bg);
    border: none;
    color: var(--text-light);
    font-size: 12px;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
    box-shadow: 0 2px 8px var(--shadow-strong);
    transition: all 0.2s;
  }
  .card-header-btns .btn-auto.active { background: var(--secondary); color: #fff; }
  .card-wrapper {
    position: absolute; inset: 10px 16px 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
  }

  /* ========== 卡片基础 ========== */
  .card {
    width: 100%;
    max-width: 420px;
    max-height: 100%;
    background: var(--card-bg);
    border-radius: 28px;
    box-shadow: 0 8px 32px var(--shadow-strong);
    padding: 24px 20px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    border-radius: 28px;
    opacity: 0;
    transition: opacity 0.6s;
    pointer-events: none;
  }
  .card.shine::before {
    opacity: 1;
    background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,0.4) 0%, transparent 60%);
  }

  /* ========== 卡片进入动画 ========== */
  .card {
    transform: scale(0.5) rotateY(90deg) translateZ(-100px);
    opacity: 0;
    transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.5s ease;
  }
  .card.show {
    transform: scale(1) rotateY(0deg) translateZ(0);
    opacity: 1;
  }
  .card.hide-out {
    transform: scale(0.7) rotateY(-90deg) translateX(80px);
    opacity: 0;
  }

  /* ========== 卡片弹跳粒子 ========== */
  .particles {
    position: absolute;
    pointer-events: none;
    width: 100%; height: 100%;
    top: 0; left: 0;
    overflow: hidden;
  }
  .particle {
    position: absolute;
    width: 8px; height: 8px;
    border-radius: 50%;
    opacity: 0;
    animation: particleFly 0.8s ease forwards;
  }
  @keyframes particleFly {
    0% { transform: translate(0, 0) scale(1); opacity: 1; }
    100% { transform: translate(var(--px), var(--py)) scale(0); opacity: 0; }
  }

  /* ========== 卡片图片区 ========== */
  .card-image {
    font-size: 100px;
    line-height: 1.2;
    text-align: center;
    margin-bottom: 8px;
    animation: cardImageFloat 3s ease-in-out infinite;
    position: relative;
  }
  .card-image.bounce {
    animation: cardImageBounce 0.5s ease;
  }
  @keyframes cardImageFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  @keyframes cardImageBounce {
    0% { transform: scale(1) translateY(0); }
    30% { transform: scale(1.2) translateY(-15px); }
    60% { transform: scale(0.95) translateY(5px); }
    100% { transform: scale(1) translateY(0); }
  }
  .card-image img { max-width: 160px; max-height: 160px; border-radius: 16px; object-fit: contain; }

  /* ========== 卡片英文 ========== */
  .card-english {
    font-size: 36px;
    font-weight: 900;
    color: var(--text);
    text-align: center;
    letter-spacing: 1px;
    margin-bottom: 4px;
    position: relative;
  }
  .card-english.sentence { font-size: 24px; line-height: 1.4; }
  .card-english.pop {
    animation: textPop 0.4s ease;
  }
  @keyframes textPop {
    0% { transform: scale(0.5); opacity: 0; }
    60% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }

  /* ========== 卡片中文 ========== */
  .card-chinese {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-light);
    text-align: center;
    margin-bottom: 10px;
  }
  .card-chinese.sentence { font-size: 16px; line-height: 1.5; }

  /* ========== 对话气泡 ========== */
  .dialogue-area {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin: 4px 0;
  }
  .dialogue-bubble {
    max-width: 85%;
    padding: 10px 16px;
    border-radius: 18px;
    font-size: 15px;
    font-weight: 700;
    line-height: 1.4;
    opacity: 0;
    transform: scale(0.8);
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
  }
  .dialogue-bubble.show {
    opacity: 1;
    transform: scale(1);
  }
  .dialogue-bubble.left {
    align-self: flex-start;
    background: var(--primary-light);
    border-bottom-left-radius: 4px;
    color: var(--text);
    transform-origin: left bottom;
  }
  .dialogue-bubble.right {
    align-self: flex-end;
    background: var(--secondary);
    border-bottom-right-radius: 4px;
    color: #fff;
    transform-origin: right bottom;
  }
  .dialogue-bubble .role-tag {
    font-size: 11px;
    font-weight: 800;
    opacity: 0.6;
    margin-bottom: 2px;
  }
  .dialogue-bubble .en-text {
    font-size: 16px;
  }
  .dialogue-bubble .zh-text {
    font-size: 13px;
    opacity: 0.8;
    margin-top: 2px;
  }
  .dialogue-bubble .speaking-indicator {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
    margin-left: 4px;
    animation: blink 0.6s ease infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  /* ========== 主题色条 ========== */
  .card-theme-animals { border-top: 5px solid var(--orange); }
  .card-theme-fruits { border-top: 5px solid var(--accent); }
  .card-theme-vegetables { border-top: 5px solid var(--green); }
  .card-theme-colors { border-top: 5px solid var(--purple); }
  .card-theme-numbers { border-top: 5px solid var(--blue); }
  .card-theme-toys { border-top: 5px solid var(--yellow); }
  .card-theme-clothes { border-top: 5px solid var(--pink); }
  .card-theme-home { border-top: 5px solid var(--primary); }
  .card-theme-transport { border-top: 5px solid var(--blue); }
  .card-theme-food { border-top: 5px solid var(--orange); }
  .card-theme-body { border-top: 5px solid var(--accent); }
  .card-theme-weather { border-top: 5px solid var(--blue); }
  .card-theme-actions { border-top: 5px solid var(--green); }
  .card-theme-phrases { border-top: 5px solid var(--purple); }
  .card-theme-dialogue { border-top: 5px solid var(--accent2); }
  .card-theme-shapes { border-top: 5px solid var(--yellow); }
  .card-theme-opposites { border-top: 5px solid var(--secondary); }
  .card-theme-jobs { border-top: 5px solid var(--primary); }
  .card-theme-stories { border-top: 5px solid var(--yellow); }
  .card-theme-listening { border-top: 5px solid var(--accent2); }
  .card-theme-listening .card-english { font-size: 22px; }
  .card-theme-phonetics .card-english { font-size: 28px; letter-spacing: 2px; }

  /* ========== 朗读按钮 ========== */
  .btn-speak {
    background: var(--primary-light);
    border: none;
    color: var(--text);
    font-size: 16px;
    font-weight: 700;
    padding: 10px 28px;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 3px 12px var(--shadow);
    transition: transform 0.2s, box-shadow 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 6px;
    position: relative;
    z-index: 2;
  }
  .btn-speak:active { transform: scale(0.93); }
  .btn-speak.speaking {
    background: var(--secondary);
    color: #fff;
    animation: speakPulse 0.6s ease infinite;
  }
  @keyframes speakPulse {
    0%, 100% { transform: scale(1); box-shadow: 0 3px 12px var(--shadow); }
    50% { transform: scale(1.05); box-shadow: 0 6px 20px var(--shadow-strong); }
  }
  .btn-speak .icon { font-size: 22px; }

  /* ========== 底部导航 ========== */
  .reader-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px 16px;
    flex-shrink: 0;
    gap: 12px;
  }
  .btn-nav {
    background: var(--card-bg);
    border: none;
    color: var(--text);
    font-size: 14px;
    font-weight: 800;
    padding: 10px 20px;
    border-radius: 24px;
    cursor: pointer;
    box-shadow: 0 3px 12px var(--shadow);
    transition: transform 0.15s, opacity 0.15s;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .btn-nav:active { transform: scale(0.93); }
  .btn-nav:disabled { opacity: 0.3; pointer-events: none; }
  .btn-nav .arrow { font-size: 20px; }

  .progress-bar {
    flex: 1;
    height: 6px;
    background: var(--primary-light);
    border-radius: 6px;
    overflow: hidden;
    margin: 0 4px;
  }
  .progress-fill {
    height: 100%;
    background: var(--primary);
    border-radius: 6px;
    transition: width 0.3s ease;
  }

  .btn-auto {
    background: var(--card-bg);
    border: none;
    color: var(--text-light);
    font-size: 12px;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
    box-shadow: 0 2px 8px var(--shadow);
    transition: all 0.2s;
  }
  .btn-auto.active { background: var(--secondary); color: #fff; }

  /* ========== 彩纸庆祝 ========== */
  .confetti-container {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 300;
    overflow: hidden;
  }
  .confetti {
    position: absolute;
    width: 10px; height: 10px;
    opacity: 0;
    animation: confettiFall var(--dur, 2s) ease forwards;
  }
  @keyframes confettiFall {
    0% { transform: translateY(-20px) rotate(0deg) scale(0); opacity: 0; }
    20% { opacity: 1; transform: translateY(20vh) rotate(180deg) scale(1); }
    100% { transform: translateY(100vh) rotate(720deg) scale(0.5); opacity: 0; }
  }

  /* ========== 滚动条 ========== */
  .catalog::-webkit-scrollbar { width: 4px; }
  .catalog::-webkit-scrollbar-track { background: transparent; }
  .catalog::-webkit-scrollbar-thumb { background: var(--primary-light); border-radius: 4px; }

  /* ========== 响应式 ========== */
  @media (max-width: 380px) {
    .catalog-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .card-english { font-size: 28px; }
    .card-english.sentence { font-size: 20px; }
    .card-image { font-size: 72px; }
    .card-image img { max-width: 120px; max-height: 120px; }
  }
  @media (min-width: 600px) {
    .catalog-grid { grid-template-columns: repeat(4, 1fr); }
    .card { max-width: 500px; padding: 32px 28px; }
    .card-english { font-size: 42px; }
    .card-image { font-size: 120px; }
  }
</style>
</head>
<body>

<div class="splash" id="splash">
  <div class="splash-logo">🌈</div>
  <div class="splash-title">开心学英语</div>
  <div class="splash-sub">宝贝准备好了吗？</div>
  <div class="splash-loading"><div class="splash-loading-bar" id="loadingBar"></div></div>
</div>

<div class="catalog" id="catalog">
  <div class="catalog-header">
    <div class="catalog-title">
      <span>🌈</span><span>开</span><span>心</span><span>学</span><span>英</span><span>语</span>
    </div>
    <div class="catalog-sub">点一点，学一学，每天进步一点点 ✨</div>

      { en: 'Happy Birthday!', zh: '生日快乐！', emoji: '🎂', sentence: 'Thank you! I\'m so happy!', sentenceZh: '谢谢！我好开心！', roleA: '大家', roleB: '宝宝' },

  {
    id: 'stories', name: '📖 寓言故事', icon: '📖',
    items: [
      { en: 'The Tortoise and the Hare', zh: '龟兔赛跑', emoji: '🐢🐰', story: 'Once upon a time, there was a hare who was very proud of how fast he could run. He laughed at the tortoise for being so slow. The tortoise said, "Let\'s have a race!" The hare agreed and they started running. The hare ran very fast and soon was far ahead. He thought, "I am so fast, I can take a nap." So he fell asleep under a tree. The tortoise kept walking slowly and steadily. He passed the sleeping hare and reached the finish line first. When the hare woke up, it was too late! The tortoise had won.', storyZh: '从前有一只兔子很骄傲自己跑得快。他嘲笑乌龟爬得慢。乌龟说我们来比赛吧。兔子答应了。兔子跑得很快远远领先。他想我这么快可以打个盹。于是他在树下睡着了。乌龟慢慢地稳稳地一直走。他超过了睡着的兔子先到达终点。兔子醒来时已经太晚了。乌龟赢了。' },
      { en: 'The Lion and the Mouse', zh: '狮子和老鼠', emoji: '🦁🐭', story: 'A lion was sleeping in the forest. A little mouse ran over his nose and woke him up. The lion caught the mouse and was going to eat him. The mouse said, "Please let me go! One day I might help you." The lion laughed, "How could a tiny mouse help me?" But he let the mouse go. Later, the lion got caught in a hunter\'s net. He roared loudly. The mouse heard him and came running. He gnawed through the ropes with his sharp teeth and set the lion free. The lion said, "Thank you, little friend!"', storyZh: '一头狮子在森林里睡觉。一只小老鼠跑过他的鼻子把他吵醒了。狮子抓住老鼠准备吃掉他。老鼠说请放了我吧有一天我可能会帮你。狮子笑了说你这么小怎么能帮我。但他还是放了老鼠。后来狮子被猎人的网抓住了。他大声吼叫。老鼠听到后跑来了。他用锋利的牙齿咬断绳子把狮子救了出来。狮子说谢谢你小朋友。' },
      { en: 'The Ant and the Grasshopper', zh: '蚂蚁和蚱蜢', emoji: '🐜🦗', story: 'In the summer, an ant was busy gathering food and storing it for the winter. A grasshopper was playing and singing all day. He said to the ant, "Come and play with me! Why work so hard?" The ant said, "I am preparing for the winter. You should too." But the grasshopper just laughed and continued playing. When winter came, the grasshopper had no food. He was hungry and cold. He went to the ant and asked for food. The ant shared his food and said, "Next time, remember to work today so you can rest tomorrow."', storyZh: '夏天蚂蚁忙着收集食物为冬天储存。蚱蜢整天玩耍唱歌。他对蚂蚁说来和我玩吧为什么这么辛苦。蚂蚁说我在为冬天做准备你也应该这样做。但蚱蜢只是笑笑继续玩。冬天来了蚱蜢没有食物。他又饿又冷。他去找蚂蚁要食物。蚂蚁分享了自己的食物说明年记住今天努力工作明天才能休息。' },
      { en: 'The Boy Who Cried Wolf', zh: '狼来了', emoji: '👦🐺', story: 'There was a boy who looked after sheep. He was bored, so he shouted, "Wolf! Wolf! Help!" The villagers came running to help him. But there was no wolf. The boy laughed at them. The next day, he did the same thing again. The villagers came again, but again there was no wolf. They were angry. Then one day, a real wolf came. The boy shouted, "Wolf! Wolf! Please help!" But the villagers thought he was joking again. Nobody came. The wolf ate all the sheep. The boy learned his lesson.', storyZh: '有一个男孩在放羊。他觉得无聊就大喊狼来了救命。村民们跑来帮他。但没有狼。男孩嘲笑他们。第二天他又做了同样的事。村民们又来了但还是没有狼。他们很生气。后来有一天真的狼来了。男孩大喊狼来了请帮帮我。但村民们以为他又在开玩笑。没有人来。狼把所有的羊都吃了。男孩明白了他的教训。' },
      { en: 'The Fox and the Grapes', zh: '狐狸和葡萄', emoji: '🦊🍇', story: 'A hungry fox was walking through a forest. He saw a bunch of beautiful grapes hanging from a high vine. The grapes looked big and sweet. The fox wanted to eat them. He jumped up to reach the grapes, but they were too high. He tried again and again, but he could not reach them. Finally, the fox gave up. He walked away and said, "Those grapes are probably sour anyway."', storyZh: '一只饥饿的狐狸穿过森林。他看到一串漂亮的葡萄挂在高高的藤上。葡萄看起来又大又甜。狐狸想吃葡萄。他跳起来去够葡萄但太高了。他试了一次又一次但够不着。最后狐狸放弃了。他走开说那些葡萄可能还是酸的。' },
      { en: 'The Crow and the Pitcher', zh: '乌鸦喝水', emoji: '🐦🫗', story: 'A thirsty crow found a pitcher with a little water at the bottom. But the water was too low for the crow to reach. The crow thought and thought. Then he had an idea! He picked up small stones with his beak and dropped them into the pitcher one by one. As more stones went in, the water level rose higher and higher. Finally, the water came up to the top and the crow could drink. The clever crow was not thirsty anymore.', storyZh: '一只口渴的乌鸦发现了一个水罐底部有一点水。但水太低了乌鸦够不着。乌鸦想啊想。然后他有了主意。他用嘴叼起小石子一颗一颗地扔进水罐里。随着更多石子进去水位越来越高。最后水升到了顶部乌鸦喝到了水。聪明的乌鸦不再口渴了。' },
      { en: 'The Little Red Hen', zh: '小红母鸡', emoji: '🐔🌾', story: 'A little red hen found some wheat seeds. She asked, "Who will help me plant these seeds?" "Not I," said the cat. "Not I," said the dog. "Not I," said the duck. So the little red hen planted the seeds herself. When the wheat grew, she asked, "Who will help me cut the wheat?" "Not I," said everyone. So she did it herself. She made the bread herself. When the bread was ready, she asked, "Who will help me eat the bread?" "I will!" said everyone. But the little red hen said, "No! I will eat it myself."', storyZh: '一只小红母鸡发现了一些麦种。她问谁来帮我种这些种子。我不猫说。我不狗说。我不鸭子说。于是小红母鸡自己种了种子。麦子长出来后她问谁来帮我割麦子。我不大家都说。于是她自己做了。面包做好了她说谁来帮我吃面包。我来大家都说。但小红母鸡说不我自己吃。' },
      { en: 'The Golden Eggs', zh: '金蛋', emoji: '🥚✨', story: 'A farmer had a goose that laid a golden egg every day. The farmer and his wife were very happy. Every day they got one golden egg. But the farmer was greedy. He thought, "If the goose can lay one golden egg a day, imagine how many eggs are inside her! I should cut her open and get all the eggs at once." So he killed the goose and cut her open. But inside, there were no golden eggs. Now he had no goose and no more golden eggs.', storyZh: '一个农夫有一只鹅每天下一个金蛋。农夫和他的妻子非常高兴。每天他们得到一个金蛋。但农夫很贪婪。他想如果鹅一天能下一个金蛋那她肚子里该有多少金蛋啊。我应该把她切开一次拿到所有金蛋。于是他杀了鹅把她切开。但里面没有金蛋。现在他没有鹅也没有金蛋了。' },
      { en: 'The Three Little Pigs', zh: '三只小猪', emoji: '🐷🐷🐷🐺', story: 'Three little pigs each built a house. The first pig built a house of straw. The second pig built a house of sticks. The third pig built a house of bricks. A big bad wolf came. He blew down the straw house. He blew down the stick house. But he could not blow down the brick house. The wolf tried to go down the chimney, but the third pig put a pot of boiling water there. The wolf ran away and never came back.', storyZh: '三只小猪各盖了一栋房子。第一只小猪盖了草房子。第二只小猪盖了木房子。第三只小猪盖了砖房子。一只大坏狼来了。他吹倒了草房子。他吹倒了木房子。但他吹不倒砖房子。狼想从烟囱下去但第三只小猪放了一锅开水在那里。狼逃跑了再也没有回来。' },
      { en: 'The Ugly Duckling', zh: '丑小鸭', emoji: '🦆🦢', story: 'A mother duck had many little ducklings. One of them looked different. He was big and gray. The other ducks laughed at him. The poor ugly duckling was very sad. He ran away. Winter came and he was cold and alone. Then spring came. The ugly duckling looked at his reflection in the water. He was not a duck at all! He had grown into a beautiful white swan. The other swans welcomed him. He was the most beautiful swan of all.', storyZh: '鸭妈妈生了很多小鸭子。其中一只看起来不一样。他又大又灰。其他鸭子都嘲笑他。可怜的丑小鸭非常伤心。他逃走了。冬天来了他又冷又孤单。春天来了。丑小鸭看着水中的倒影。他根本不是鸭子。他已经长成了一只美丽的白天鹅。其他天鹅欢迎了他。他是所有天鹅中最美的一只。' },
    ]

      { en: 'Morning Routine', zh: '早上起床', emoji: '🌅', story: 'Good morning! Time to wake up. Open your eyes, stretch your arms, and get out of bed. Let\'s wash your face and brush your teeth. Now put on your clothes. What a nice day! Let\'s have breakfast. Eat your bread and drink your milk. Yummy! Now let\'s go to school!', storyZh: '早上好！该起床了。睁开眼睛，伸个懒腰，下床吧。我们洗脸刷牙。穿上衣服。多好的天气！吃早餐吧。吃面包喝牛奶。好吃！现在我们去上学吧！', duration: '3分钟' },
      { en: 'At the Park', zh: '在公园', emoji: '🌳', story: 'Let\'s go to the park! Look at the green trees and beautiful flowers. The birds are singing in the sky. I see a dog running on the grass. Children are playing on the swings and slides. Let\'s fly a kite! The wind is blowing gently. Oh, look! A butterfly is flying around. What a happy day at the park!', storyZh: '我们去公园吧！看绿色的树和美丽的花。鸟儿在天空中歌唱。我看到一只狗在草地上跑。孩子们在荡秋千和滑滑梯。我们放风筝吧！风轻轻地吹。哦，看！一只蝴蝶在飞。在公园真开心！', duration: '3分钟' },
      { en: 'My Family', zh: '我的家人', emoji: '👨‍👩‍👧‍👦', story: 'This is my family. I love my family. My daddy is tall and strong. He reads stories to me every night. My mommy is kind and beautiful. She cooks yummy food for me. I have a little brother. We play together every day. We also have a pet cat. Its name is Mimi. I love my family very much!', storyZh: '这是我的家人。我爱我的家人。我爸爸又高又强壮，他每天晚上给我读故事。我妈妈温柔又漂亮，她给我做好吃的。我有一个小弟弟，我们每天一起玩。我们还有一只宠物猫，它叫咪咪。我非常爱我的家人！', duration: '3分钟' },
      { en: 'A Day at School', zh: '在学校的一天', emoji: '🏫', story: 'Hello! Welcome to my school. My school is big and beautiful. We have a big playground. I like to play there. In the morning, we read books and sing songs. My teacher is very nice. She teaches us many things. At lunch time, I eat with my friends. We share our food. In the afternoon, we draw pictures and play games. School is so much fun!', storyZh: '你好！欢迎来到我的学校。我的学校又大又漂亮。我们有一个大操场，我喜欢在那里玩。早上我们读书唱歌。我的老师非常好，她教我们很多东西。午饭时间，我和朋友们一起吃。我们分享食物。下午我们画画做游戏。学校真好玩！', duration: '3分钟' },
      { en: 'Let\'s Count Together', zh: '一起数数', emoji: '🔢', story: 'Let\'s count together! One, two, three, four, five. Five little ducks went out to play. Six, seven, eight, nine, ten. Ten little stars are shining bright. I have two eyes, one nose, and ten fingers. How many apples? One, two, three! How many birds? One, two, three, four! Counting is so much fun! Can you count with me?', storyZh: '我们一起数数！一二三四五。五只小鸭出去玩。六七八九十。十颗小星星在闪耀。我有两只眼睛、一个鼻子和十根手指。有多少个苹果？一二三！有多少只鸟？一二三四！数数真好玩！你能和我一起数吗？', duration: '3分钟' },
      { en: 'Weather and Seasons', zh: '天气和季节', emoji: '🌤️', story: 'Let\'s talk about the weather. Today is a sunny day. The sun is warm and bright. In spring, flowers bloom and birds sing. In summer, we go swimming and eat ice cream. In autumn, leaves turn yellow and red. In winter, it snows and we play in the snow. I like all four seasons. Every season is beautiful!', storyZh: '我们来聊聊天气。今天是晴天，太阳温暖又明亮。春天，花儿开放，鸟儿歌唱。夏天，我们去游泳，吃冰淇淋。秋天，树叶变黄变红。冬天，下雪了，我们在雪地里玩。我喜欢四个季节。每个季节都很美丽！', duration: '3分钟' },
      { en: 'Animal Friends', zh: '动物朋友', emoji: '🐾', story: 'Animals are our friends. Look at the dog. It says woof woof! The cat says meow meow. The cow says moo moo. The duck says quack quack. The pig says oink oink. The sheep says baa baa. What does the lion say? Roar! What does the bird say? Tweet tweet! Animals make different sounds. Can you make animal sounds too? Let\'s try together!', storyZh: '动物是我们的朋友。看小狗，它叫汪汪！小猫叫喵喵。奶牛叫哞哞。鸭子叫嘎嘎。猪叫哼哼。羊叫咩咩。狮子怎么叫？吼！小鸟怎么叫？叽叽喳喳！动物发出不同的声音。你也能学动物叫吗？我们一起试试吧！', duration: '3分钟' },
      { en: 'Colors Around Us', zh: '身边的颜色', emoji: '🎨', story: 'Colors are everywhere! The sky is blue. The sun is yellow. The grass is green. The flower is red. The cloud is white. The night is black. The grape is purple. The orange is orange! What color is your shirt? What color is your bag? Look around you. How many colors can you see? Red, blue, yellow, green... The world is so colorful!', storyZh: '颜色无处不在！天空是蓝色的。太阳是黄色的。草是绿色的。花是红色的。云是白色的。夜晚是黑色的。葡萄是紫色的。橙子是橙色的！你的衬衫是什么颜色？你的书包是什么颜色？看看周围。你能看到多少种颜色？红、蓝、黄、绿……世界真多彩！', duration: '3分钟' },
      { en: 'Good Habits', zh: '好习惯', emoji: '🌟', story: 'Good habits make us healthy! Wake up early every morning. Wash your hands before eating. Brush your teeth twice a day. Eat lots of fruits and vegetables. Drink plenty of water. Exercise every day. Go to bed early at night. Share your toys with friends. Say please and thank you. Always be kind to others. These good habits will make you a great kid!', storyZh: '好习惯让我们健康！每天早上早起。饭前洗手。每天刷两次牙。多吃水果蔬菜。多喝水。每天锻炼。晚上早睡。和朋友分享玩具。说请和谢谢。对别人友善。这些好习惯会让你成为很棒的孩子！', duration: '3分钟' },
      { en: 'Bedtime Story', zh: '睡前故事', emoji: '🌙', story: 'The moon is shining bright. The stars are twinkling in the sky. It\'s time to go to bed. Close your eyes, my little one. Dream of beautiful butterflies and friendly animals. Imagine you are flying on a cloud. You are swimming in a river of stars. The night is gentle and quiet. Tomorrow will be a wonderful day. Good night, sleep tight, sweet dreams!', storyZh: '月亮明亮地照耀着。星星在天空中闪烁。该睡觉了。闭上眼睛，我的小宝贝。梦见美丽的蝴蝶和友好的动物。想象你飞在云朵上。你在星星的河流中游泳。夜晚温柔而安静。明天将是美好的一天。晚安，睡个好觉，做个好梦！', duration: '3分钟' },
      { en: 'At the Zoo', zh: '在动物园', emoji: '🦁', story: 'Welcome to the zoo! Look at the big elephant. It has a long nose. The giraffe has a very long neck. The monkey is jumping and playing. The penguins are walking funny. The polar bear likes cold water. The snake is sleeping. The parrot can talk! Hello! What does it say? The zoo is full of amazing animals. Every animal is special. Which animal do you like best?', storyZh: '欢迎来到动物园！看大象，它有个长鼻子。长颈鹿有非常长的脖子。猴子在跳来跳去玩耍。企鹅走路很有趣。北极熊喜欢冷水。蛇在睡觉。鹦鹉会说话！你好！它说什么了？动物园里充满了神奇的动物。每种动物都很特别。你最喜欢哪种动物？', duration: '3分钟' },
      { en: 'My Body', zh: '我的身体', emoji: '👶', story: 'This is my body! I have a head on top. I have two eyes to see. I have two ears to hear. I have one nose to smell. I have one mouth to eat and talk. I have two shoulders, two arms, and two hands. I have ten fingers! I have two legs and two feet. I have ten toes! I can run, jump, clap, and dance. My body is amazing!', storyZh: '这是我的身体！我上面有个头。我有两只眼睛看东西。我有两只耳朵听声音。我有一个鼻子闻气味。我有一张嘴吃东西和说话。我有两个肩膀、两条胳膊和两只手。我有十根手指！我有两条腿和两只脚。我有十个脚趾！我会跑、跳、拍手和跳舞。我的身体太棒了！', duration: '3分钟' },
      { en: 'Let\'s Go Shopping', zh: '我们去购物', emoji: '🛒', story: 'Let\'s go shopping! We go to the supermarket. We need to buy some food. Let\'s get some apples and bananas. We also need milk and bread. Look at the cookies! Can we buy some? Okay, let\'s get some cookies too. We pay at the cashier. Thank you! Now we carry our bags home. Shopping is fun!', storyZh: '我们去购物！我们去超市。我们需要买一些食物。我们买一些苹果和香蕉吧。我们还需要牛奶和面包。看那些饼干！我们能买一些吗？好吧，我们也买一些饼干。我们在收银台付钱。谢谢！现在我们提着袋子回家。购物真好玩！', duration: '3分钟' },
      { en: 'Playing with Friends', zh: '和朋友玩', emoji: '🤝', story: 'Playing with friends is fun! Let\'s play together. We can play hide and seek. You hide, I will find you! We can play ball. Throw the ball to me! Catch! We can build blocks. Let\'s make a tall tower. We can draw pictures. I draw a rainbow. You draw a flower. Sharing and playing together makes us happy. Friends are the best!', storyZh: '和朋友玩真开心！我们一起玩吧。我们可以玩捉迷藏。你藏起来，我来找你！我们可以玩球。把球扔给我！接住！我们可以搭积木。我们来搭一个高塔。我们可以画画。我画一道彩虹。你画一朵花。一起分享和玩耍让我们快乐。朋友最棒了！', duration: '3分钟' },
      { en: 'Yummy Food', zh: '好吃的食物', emoji: '🍽️', story: 'I like yummy food! For breakfast, I eat bread and eggs. I drink a glass of milk. For lunch, I have rice, chicken, and vegetables. For dinner, I eat noodles and soup. I like fruits too. Apples, bananas, grapes, and strawberries. Eating healthy food makes me strong. Let\'s eat together! What\'s your favorite food?', storyZh: '我喜欢好吃的食物！早餐我吃面包和鸡蛋，喝一杯牛奶。午餐我吃米饭、鸡肉和蔬菜。晚餐我吃面条和汤。我也喜欢水果。苹果、香蕉、葡萄和草莓。吃健康的食物让我强壮。我们一起吃吧！你最喜欢的食物是什么？', duration: '3分钟' },
    ]
  }
];

// ========== 统计 ==========
function calcStats() {
  let words = 0, phrases = 0, dialogues = 0;
  THEMES.forEach(t => {
    if (t.id === 'phrases') phrases += t.items.length;
    else if (t.id === 'dialogue') dialogues += t.items.length;
    else words += t.items.length;
  });
  totalWords.textContent = `${words} 个词汇`;
  totalPhrases.textContent = `${phrases} 个短句`;
  totalDialogues.textContent = `${dialogues} 组对话`;
}

// ========== 渲染目录 ==========
function renderCatalog() {
  // 渲染导航
  const nav = document.getElementById('catalogNav');
  const navInner = document.getElementById('catalogNavInner');
  let navHtml = '';
  THEMES.forEach((theme, ti) => {
    const icon = theme.icon || theme.name.match(/^\S+/)?.[0] || '📚';
    const iconClean = (icon || '').replace(/[^a-zA-Z0-9À-ɏЀ-ӿ؀-ۿ一-鿿぀-ゟ゠-ヿ☀-⟯\uD800-􏰀-\uDFFF]/g, '').trim() || '📚';
    navHtml += '<div class="catalog-nav-item" data-nav-theme="' + ti + '">' +
      '<span class="nav-icon">' + theme.icon + '</span>' +
      '<span>' + theme.name.replace(/[^一-龥A-Za-z0-9\s]/g, '').trim() + '</span>' +
    '</div>';
  });
  navInner.innerHTML = navHtml;

  // 导航折叠按钮
  const navToggle = document.getElementById('navToggle');
  let navCollapsed = false;
  if (navToggle) {
    // 点击折叠/展开（贴在左侧）
    navToggle.addEventListener('click', function() {
      navCollapsed = !navCollapsed;
      nav.classList.toggle('collapsed', navCollapsed);
      navToggle.textContent = navCollapsed ? '▶' : '◀';
      navToggle.classList.toggle('collapsed', navCollapsed);
    });

    // 点击导航项时展开
    navInner.querySelectorAll('.catalog-nav-item').forEach(function(el) {
      el.addEventListener('click', function() {
        if (navCollapsed) {
          navCollapsed = false;
          nav.classList.remove('collapsed');
          navToggle.textContent = '◀';
          navToggle.classList.remove('collapsed');
        }
        var ti = parseInt(el.dataset.navTheme);
        var group = catalogContent.querySelectorAll('.catalog-group')[ti];
        if (group) {
          navInner.querySelectorAll('.catalog-nav-item').forEach(function(n) { n.classList.remove('active'); });
          el.classList.add('active');
          var navHeight = document.getElementById('catalogNav').offsetHeight;
          var top = group.getBoundingClientRect().top + catalog.scrollTop - navHeight - 10;
          catalog.scrollTo({ top: top, behavior: 'smooth' });
          setTimeout(function() {
            navInner.querySelectorAll('.catalog-nav-item').forEach(function(n) { n.classList.remove('active'); });
          }, 1500);
        }
      });
    });
  }

  // 滑动自动隐藏
  let lastScrollTop = 0;
  catalog.addEventListener('scroll', function() {
    var scrollTop = catalog.scrollTop;
    if (scrollTop > 60 && scrollTop > lastScrollTop + 10 && !navCollapsed) {
      nav.classList.add('hide-nav');
    } else if (scrollTop < lastScrollTop - 10 || scrollTop < 60) {
      nav.classList.remove('hide-nav');
    }
    lastScrollTop = scrollTop;
  });

  let html = '';
  THEMES.forEach((theme, ti) => {
    html += `<div class="catalog-group">`;
    html += `<div class="catalog-group-title">${theme.name}</div>`;
    html += `<div class="catalog-grid">`;
    theme.items.forEach((item, ii) => {
      const delay = (ii % 12) * 0.05;
      html += `<div class="catalog-item" data-theme="${ti}" data-index="${ii}" style="animation-delay:${delay}s">
        <span class="icon">${item.emoji}</span>
        <div class="name">${item.en}</div>
        <div class="count">${item.zh}</div>
      </div>`;
    });
    html += `</div></div>`;
  });
  catalogContent.innerHTML = html;

  catalogContent.querySelectorAll('.catalog-item').forEach(el => {
    el.addEventListener('click', () => {
      const ti = parseInt(el.dataset.theme);
      const ii = parseInt(el.dataset.index);
      openReader(THEMES[ti], ii);
    });
  });
}

// ========== 打开阅读器 ==========
function openReader(theme, index) {
  currentTheme = theme;
  currentIndex = index;
  readerTitle.textContent = theme.name;
  reader.classList.add('active');
  showCard(false);
}

// ========== 粒子效果 ==========
function spawnParticles() {
  const colors = ['#E8B4B8', '#C4A8D9', '#A8C5C0', '#E4D5B0', '#E8C9A0', '#B0C4D9'];
  particles.innerHTML = '';
  for (let i = 0; i < 12; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const angle = (Math.PI * 2 / 12) * i + Math.random() * 0.5;
    const dist = 60 + Math.random() * 80;
    p.style.setProperty('--px', `${Math.cos(angle) * dist}px`);
    p.style.setProperty('--py', `${Math.sin(angle) * dist}px`);
    p.style.background = colors[i % colors.length];
    p.style.width = `${4 + Math.random() * 8}px`;
    p.style.height = p.style.width;
    p.style.left = '50%';
    p.style.top = '50%';
    p.style.marginLeft = '-4px';
    p.style.marginTop = '-4px';
    p.style.animationDelay = `${Math.random() * 0.3}s`;
    particles.appendChild(p);
  }
}

// ========== 彩纸庆祝 ==========
function showConfetti() {
  const colors = ['#E8B4B8', '#C4A8D9', '#A8C5C0', '#E4D5B0', '#E8C9A0', '#B0C4D9', '#B5C9B0'];
  confettiContainer.innerHTML = '';
  for (let i = 0; i < 30; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = `${Math.random() * 100}%`;
    c.style.top = `${-Math.random() * 20}%`;
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.width = `${6 + Math.random() * 8}px`;
    c.style.height = `${6 + Math.random() * 8}px`;
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    c.style.setProperty('--dur', `${1.5 + Math.random() * 2}s`);
    c.style.animationDelay = `${Math.random() * 1.5}s`;
    confettiContainer.appendChild(c);
  }
  setTimeout(() => confettiContainer.innerHTML = '', 4000);
}

// ========== 显示卡片 ==========
function showCard(animate) {
  if (!currentTheme) return;
  const items = currentTheme.items;
  const item = items[currentIndex];
  const isDialogue = currentTheme.id === 'dialogue';

  pageIndicator.textContent = `${currentIndex + 1}/${items.length}`;
  progressFill.style.width = `${((currentIndex + 1) / items.length) * 100}%`;

  // 粒子效果
  if (animate) spawnParticles();

  // 重置卡片
  card.classList.remove('show', 'hide-out', 'shine');

  // 显示蒙层 — 卡片出现时页面加蒙层，一直保持到关闭阅读器
  document.getElementById('cardContainer').classList.add('overlay');

  if (isDialogue) {
    // 对话模式
    cardContent.style.display = 'none';
    dialogueArea.style.display = 'flex';
    cardImage.style.fontSize = '60px';
    cardImage.innerHTML = '💬';

    const d = item;
    dialogueArea.innerHTML = `
      <div class="dialogue-bubble left" id="bubbleA">
        <div class="role-tag">${d.roleA || 'A'}</div>
        <div class="en-text">${d.en}</div>
        <div class="zh-text">${d.zh}</div>
      </div>
      <div class="dialogue-bubble right" id="bubbleB">
        <div class="role-tag">${d.roleB || 'B'}</div>
        <div class="en-text">${d.sentence}</div>
        <div class="zh-text">${d.sentenceZh}</div>
      </div>
    `;

    // 对话气泡动画：依次弹出
    setTimeout(() => {
      const bA = document.getElementById('bubbleA');
      if (bA) bA.classList.add('show');
    }, animate ? 300 : 50);
    setTimeout(() => {
      const bB = document.getElementById('bubbleB');
      if (bB) bB.classList.add('show');
    }, animate ? 800 : 200);

  } else {
    // 普通模式
    cardContent.style.display = 'block';
    dialogueArea.style.display = 'none';
    cardImage.style.fontSize = '';
    cardImage.innerHTML = item.emoji;

    cardEnglish.textContent = item.en;
    cardEnglish.className = 'card-english' + (item.sentence ? ' sentence' : '');

    // 显示音标（非音标模块的单词也显示）
    const phonetic = item.phonetic || getPhonetic(item.en);
    if (phonetic && currentTheme.id !== 'phonetics') {
      cardEnglish.innerHTML = `${item.en} <span style="font-size:0.5em;font-weight:600;color:var(--text-light);display:block;margin-top:2px">${phonetic}</span>`;
    } else if (currentTheme.id === 'phonetics') {
      cardEnglish.innerHTML = `${item.en} <span style="font-size:0.55em;font-weight:600;color:var(--text-light);display:block;margin-top:2px">${item.phonetic || ''}</span>`;
    }

    cardChinese.textContent = item.zh;
    cardChinese.className = 'card-chinese' + (item.sentence ? ' sentence' : '');

    // 如果有句子，显示
    if (item.sentence) {
      cardChinese.innerHTML = `${item.zh}<br><span style="font-size:0.85em;color:var(--text-light)">${item.sentenceZh}</span>`;
    }
  }

  // 音标模块特别处理
  if (currentTheme.id === 'phonetics') {
    cardImage.style.fontSize = '72px';
    cardImage.innerHTML = item.emoji;
    cardEnglish.className = 'card-english';
    cardEnglish.innerHTML = `${item.en} <span style="font-size:0.55em;font-weight:600;color:var(--text-light);display:block;margin-top:2px">${item.phonetic || ''}</span>`;
    cardChinese.innerHTML = `${item.zh}<br><span style="font-size:0.85em;color:var(--text-light)">${item.sentenceZh}</span>`;
    const mouthHint = document.createElement('div');
    mouthHint.style.cssText = 'font-size:13px;color:var(--text-light);margin-top:4px;padding:4px 12px;background:var(--primary-light);border-radius:12px;';
    mouthHint.textContent = '👄 ' + (item.sentenceZh || '');
    cardChinese.appendChild(mouthHint);
  }

  // 寓言故事模块特别处理
  if (currentTheme.id === 'stories') {
    cardContent.style.display = 'block';
    dialogueArea.style.display = 'none';
    cardImage.style.fontSize = '60px';
    cardImage.innerHTML = item.emoji;
    cardEnglish.className = 'card-english sentence';
    cardEnglish.textContent = item.en;
    cardChinese.innerHTML = '<div style="font-size:15px;line-height:1.6;margin-bottom:4px">' + (item.storyZh || '') + '</div>' +
      '<div style="font-size:13px;line-height:1.5;color:var(--text-light);border-top:1px solid var(--primary-light);padding-top:6px;margin-top:4px">' + (item.story || '') + '</div>';
  }

  // 听力练习模块特别处理
  if (currentTheme.id === 'listening') {
    cardContent.style.display = 'block';
    dialogueArea.style.display = 'none';
    cardImage.style.fontSize = '60px';
    cardImage.innerHTML = item.emoji;
    cardEnglish.className = 'card-english sentence';
    cardEnglish.textContent = item.en;
    cardChinese.innerHTML = `<div style="font-size:16px;line-height:1.6;margin-bottom:6px">${item.storyZh}</div>
      <div style="font-size:14px;line-height:1.5;color:var(--text-light);border-top:1px solid var(--primary-light);padding-top:6px;margin-top:4px">${item.story}</div>`;
    // 显示时长标签
    const durationTag = document.createElement('div');
    durationTag.style.cssText = 'font-size:12px;color:var(--text-light);background:var(--primary-light);padding:2px 12px;border-radius:12px;display:inline-block;margin-top:4px;';
    durationTag.textContent = `⏱ ${item.duration || '3分钟'}`;
    cardChinese.appendChild(durationTag);
  }

  // 卡片主题色
  card.className = 'card';
  card.classList.add(`card-theme-${currentTheme.id}`);

  // 卡片动画
  if (animate) {
    card.classList.add('hide-out');
    setTimeout(() => {
      card.classList.remove('hide-out');
      card.classList.add('show');
      // 英文文字弹出
      setTimeout(() => {
        if (!isDialogue) cardEnglish.classList.add('pop');
      }, 300);
    }, 50);
  } else {
    card.classList.add('show');
    if (!isDialogue) cardEnglish.classList.add('pop');
  }

  // 按钮状态
  btnPrev.disabled = currentIndex === 0;
  btnNext.disabled = currentIndex >= items.length - 1;
}

// ========== 朗读（修复版）==========
function speak() {
  if (isSpeaking || !currentTheme) return;

  const item = currentTheme.items[currentIndex];
  var isDialogue = currentTheme.id === 'dialogue';
  var isListening = currentTheme.id === 'listening';

  // 先取消任何正在进行的朗读
  window.speechSynthesis.cancel();

  isSpeaking = true;
  btnSpeak.classList.add('speaking');
  btnSpeak.innerHTML = '<span class="icon">🔊</span> 朗读中...';

  // 构建朗读序列
  const parts = [];

  if (isDialogue) {
    parts.push({ text: item.zh, lang: 'zh-CN', label: 'A中文' });
    parts.push({ text: item.en, lang: 'en-US', label: 'A英文' });
    parts.push({ text: item.sentenceZh, lang: 'zh-CN', label: 'B中文' });
    parts.push({ text: item.sentence, lang: 'en-US', label: 'B英文' });
  } else if (isListening) {
    // 听力练习：只朗读英文
    parts.push({ text: item.story, lang: 'en-US' });
  } else {
    parts.push({ text: item.zh, lang: 'zh-CN' });
    parts.push({ text: item.en, lang: 'en-US' });
    if (item.sentence) {
      parts.push({ text: item.sentenceZh, lang: 'zh-CN' });
      parts.push({ text: item.sentence, lang: 'en-US' });
    }
  }

  let partIndex = 0;

  function speakNext() {
    if (partIndex >= parts.length) {
      finishSpeak();
      // 自动播放（听力模块自动播放逻辑不变）
      if (isAutoPlaying) {
        const autoDelay = isListening ? 1000 : 800;
        autoTimer = setTimeout(() => {
          if (currentIndex < currentTheme.items.length - 1) {
            goNext();
            if (isAutoPlaying) startAutoPlay();
          } else {
            stopAutoPlay();
          }
        }, 800);
      }
      return;
    }

    const part = parts[partIndex];
    try {
      const utterance = new SpeechSynthesisUtterance(part.text);
      utterance.lang = part.lang;
      utterance.rate = 0.85;
      utterance.pitch = 1.1;
      utterance.volume = 1.0;

      // 选择声音
      try {
        const voices = window.speechSynthesis.getVoices();
        if (part.lang === 'zh-CN') {
          const zhVoice = voices.find(v => v.lang.startsWith('zh'));
          if (zhVoice) utterance.voice = zhVoice;
        } else {
          const enVoice = voices.find(v => v.lang.startsWith('en'));
          if (enVoice) utterance.voice = enVoice;
        }
      } catch(e) {}

      utterance.onend = () => {
        partIndex++;
        setTimeout(speakNext, isDialogue ? 600 : 300);
      };
      utterance.onerror = (e) => {
        partIndex++;
        setTimeout(speakNext, 200);
      };

      window.speechSynthesis.speak(utterance);
    } catch(e) {
      partIndex++;
      setTimeout(speakNext, 100);
    }
  }

  speakNext();
}

function finishSpeak() {
  isSpeaking = false;
  btnSpeak.classList.remove('speaking');
  btnSpeak.innerHTML = '<span class="icon">🔊</span> 听一听';
}

// ========== 导航 ==========
function goPrev() {
  if (currentIndex > 0) {
    window.speechSynthesis.cancel();
    finishSpeak();
    currentIndex--;
    showCard(true);
  }
}

function goNext() {
  if (currentTheme && currentIndex < currentTheme.items.length - 1) {
    window.speechSynthesis.cancel();
    finishSpeak();
    currentIndex++;
    showCard(true);
    // 最后一个卡片时触发彩纸
    if (currentIndex === currentTheme.items.length - 1) {
      setTimeout(showConfetti, 500);
    }
  } else {
    closeReader();
  }
}

function closeReader() {
  stopAutoPlay();
  window.speechSynthesis.cancel();
  finishSpeak();
  reader.classList.remove('active');
  document.getElementById('cardContainer').classList.remove('overlay');
  currentTheme = null;
  currentIndex = 0;
}

// ========== 自动播放 ==========
function toggleAutoPlay() {
  isAutoPlaying = !isAutoPlaying;
  if (isAutoPlaying) {
    btnAuto.classList.add('active');
    btnAuto.textContent = '⏸ 暂停';
    startAutoPlay();
  } else {
    stopAutoPlay();
  }
}

function startAutoPlay() {
  if (autoTimer) clearTimeout(autoTimer);
  if (!isAutoPlaying || !currentTheme) return;

  // 自动播放：先朗读，朗读结束后自动翻页（在 speak 的 finishSpeak 里处理翻页）
  speak();
}

function stopAutoPlay() {
  isAutoPlaying = false;
  btnAuto.classList.remove('active');
  btnAuto.textContent = '▶ 自动';
  if (autoTimer) {
    clearTimeout(autoTimer);
    autoTimer = null;
  }
  // 停止朗读
  window.speechSynthesis.cancel();
  finishSpeak();
}

// ========== 鼠标悬浮光效 ==========
card.addEventListener('mousemove', (e) => {
  const rect = card.getBoundingClientRect();
  const x = ((e.clientX - rect.left) / rect.width) * 100;
  const y = ((e.clientY - rect.top) / rect.height) * 100;
  card.style.setProperty('--mx', `${x}%`);
  card.style.setProperty('--my', `${y}%`);
  card.classList.add('shine');
});
card.addEventListener('mouseleave', () => {
  card.classList.remove('shine');
});

// ========== 键盘 ==========
document.addEventListener('keydown', (e) => {
  if (!currentTheme) return;
  if (e.key === 'ArrowLeft') goPrev();
  else if (e.key === 'ArrowRight') goNext();
  else if (e.key === ' ') { e.preventDefault(); speak(); }
  else if (e.key === 'Escape') closeReader();
  else if (e.key === 'a' || e.key === 'A') toggleAutoPlay();
});

// ========== 触摸滑动 ==========
let touchStartX = 0;
let touchStartY = 0;
document.addEventListener('touchstart', (e) => {
  touchStartX = e.changedTouches[0].screenX;
  touchStartY = e.changedTouches[0].screenY;
}, { passive: true });
document.addEventListener('touchend', (e) => {
  if (!currentTheme) return;
  const dx = e.changedTouches[0].screenX - touchStartX;
  const dy = e.changedTouches[0].screenY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
    if (dx > 0) goPrev();
    else goNext();
  }
}, { passive: true });

// ========== 事件绑定 ==========
btnBack.addEventListener('click', closeReader);
btnPrev.addEventListener('click', goPrev);
btnNext.addEventListener('click', goNext);
btnSpeak.addEventListener('click', speak);
btnAuto.addEventListener('click', toggleAutoPlay);

// ========== 初始化 ==========
calcStats();
renderCatalog();

// 启动页
let progress = 0;
const loadingInterval = setInterval(() => {
  progress += Math.random() * 15 + 5;
  if (progress > 100) progress = 100;
  loadingBar.style.width = `${progress}%`;
  if (progress >= 100) {
    clearInterval(loadingInterval);
    setTimeout(() => {
      splash.classList.add('hide');
      setTimeout(() => splash.style.display = 'none', 800);
    }, 400);
  }
}, 200);

// 预加载语音
function initSpeech() {
  try {
    window.speechSynthesis.getVoices();
    var silent = new SpeechSynthesisUtterance(' ');
    silent.volume = 0;
    window.speechSynthesis.speak(silent);
    window.speechSynthesis.cancel();
  } catch(e) {}
}
initSpeech();
document.addEventListener('click', function() {
  try { window.speechSynthesis.getVoices(); } catch(e) {}
}, { once: true });
try {
  window.speechSynthesis.onvoiceschanged = function() {
    window.speechSynthesis.getVoices();
  };
} catch(e) {}
</script>
